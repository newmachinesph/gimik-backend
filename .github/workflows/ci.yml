# The API's own checks. No Postgres service and no MinIO: the suite runs on
# in-memory SQLite with storage faked, and conftest blanks the Ably, Upstash,
# Sentry and SMTP settings so a test run can never reach the network - which is
# also why it cannot be made flaky by a spent rate-limit bucket.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app scripts tests

      - name: Tests
        env:
          # Settings are required at import time; these are placeholders, and
          # conftest overrides everything that would otherwise reach outward.
          DATABASE_URL: sqlite+aiosqlite://
          # 32+ bytes: PyJWT warns below the RFC 7518 minimum for SHA256.
          JWT_SECRET: ci-secret-not-for-production-0123456789
          S3_ENDPOINT_URL: http://minio.invalid:9000
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci
        run: pytest -q
