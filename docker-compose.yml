# The whole stack, self-contained. Postgres and the object store are both here:
# v2 used to reach across to the v1 project's MinIO, which is not a dependency a
# deployable stack can have - that project's directory is already gone while its
# data volume survives. The volume is mounted by name so the 522 catalog images
# that were rendered once are reused rather than re-generated.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gora
      POSTGRES_PASSWORD: gora-local
      POSTGRES_DB: gora_v2
    ports:
      - "5433:5432"   # 5433 so a system Postgres on 5432 is left alone
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gora -d gora_v2"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gora-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-gora-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - catalog-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Rate limit windows are disposable by definition - a lost counter costs at
    # most one extra allowed burst - so there is no volume and no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    # Catches everything the API sends and shows it at http://localhost:8025.
    # Verification and reset links are only testable if they land somewhere
    # readable, and this is the only reason they are testable locally at all.
    ports:
      # 1026/8026 so a Mailpit already running for another project keeps its
      # ports, the same reason Postgres sits on 5433 and the API on 8100.
      # Inside the compose network the API still reaches it on 1025.
      - "1026:1025"   # SMTP
      - "8026:8025"   # web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gora:gora-local@postgres:5432/gora_v2?sslmode=disable
      # In-network for the API's own calls; S3_PUBLIC_URL is the host name the
      # phone and the browser can actually resolve through the adb reverse.
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      REDIS_URL: redis://redis:6379/0
      # Mailpit accepts anything and delivers to its own web UI.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
    ports:
      - "8100:8000"   # 8100 so the v1 API on 8000 can keep running
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/srv/app:ro
      - ./alembic:/srv/alembic:ro
      - ./seed:/srv/seed:ro
      - ./scripts:/srv/scripts:ro
      # Dev only - the image itself does not ship tests.
      - ./tests:/srv/tests:ro
      - ./pyproject.toml:/srv/pyproject.toml:ro
    # Migrations first, exactly as the image's own CMD does. This override
    # exists for --reload, and without the upgrade it would quietly start the
    # dev stack against last week's schema - which is how a missing column gets
    # discovered from a 500 rather than from a failed boot.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres-data:
  # Rendered once by the v1 stack and kept ever since. External so a
  # `compose down -v` here can never destroy the artwork.
  catalog-data:
    external: true
    name: getgora-backend_minio-data
